description: Renesas RH850 ADCK ADC controller

compatible: "renesas,rh850-adck"

include:
  - base.yaml
  - adc-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true
    description: Must contain sg0, sg1, sg2, sg3, and sg4 scan-group end interrupts.

  clocks:
    description: Optional clock controller reference used to enable the ADCK peripheral clock.

  vref-mv:
    type: int
    description: ADC reference voltage in millivolts for raw-to-millivolt conversion.

  channel-available-mask:
    type: int
    required: true
    description: Bit mask of Zephyr ADC channel IDs available on this controller.

  dmas:
    description: DMA channel used to transfer ADC conversion results.

  renesas,unit:
    type: int
    required: true
    description: Hardware ADCK unit index.

  renesas,scan-group:
    type: int
    required: true
    enum: [0, 1, 2, 3, 4]
    description: Scan group used for software-triggered conversion.

  renesas,physical-channel-mask:
    type: array
    required: true
    description: |
      Two 32-bit cells describing the physical input selector values supported
      by this ADCK instance. Cell 0 covers selectors 0 through 31 and cell 1
      covers selectors 32 through 63. This mask documents the selector values
      available on the target SoC instance.

  renesas,start-virtual-channel:
    type: int
    default: 0
    description: |
      First virtual channel included in the selected scan group.
      If omitted, the scan group starts at virtual channel 0.

  renesas,end-virtual-channel:
    type: int
    default: 0
    description: |
      Last virtual channel included in the selected scan group.
      If omitted, the scan group ends at virtual channel 0.

  renesas,data-format:
    type: string
    default: "12-bit-unsigned-right-justified"
    enum:
      - "12-bit-signed-fixed-point"
      - "12-bit-signed-integer"
      - "12-bit-unsigned-fixed-point"
      - "10-bit-unsigned-fixed-point"
      - "12-bit-unsigned-right-justified"
      - "12-bit-unsigned-left-justified"
    description: |
      Static controller-wide ADCK result format. Non-integer formats are
      returned in the 16-bit raw representation defined by the hardware.

  renesas,scan-mode:
    type: string
    default: "multicycle"
    enum:
      - "continuous"
      - "multicycle"
    description: Select scan mode for adck.

  renesas,trigger-method:
    type: string
    default: "software"
    enum: ["software", "hardware", "ad-timer", "th-a", "th-b"]

  renesas,trigger-source:
    type: string
    default: "disabled"
    enum: ["disabled", "pic2"]
    description: Hardware trigger route for ADCK. LPS is intentionally excluded.

  renesas,ad-timer-trigger-method:
    type: string
    default: "software"
    enum: ["software", "hardware"]

  renesas,ad-timer-initial-phase:
    type: int
    default: 0

  renesas,ad-timer-cycle:
    type: int
    default: 2097151

  renesas,th-channel-mask:
    type: int
    default: 0
    description: Bit mask enabling T&H units 0 through 3.

io-channel-cells:
  - input

child-binding:
  description: ADCK ADC channel configuration

  properties:
    reg:
      required: true
      description: Zephyr ADC channel ID used in adc_sequence.channels.

    zephyr,gain:
      required: true

    zephyr,reference:
      required: true

    zephyr,acquisition-time:
      required: true

    zephyr,resolution:
      type: int
      enum: [10, 12]
      description: Channel resolution used by Zephyr devicetree helpers.

    renesas,virtual-channel:
      type: int
      description: Hardware virtual channel associated with this Zephyr channel.

    renesas,conversion-type:
      type: string
      default: "normal"
      enum:
        - "normal"
        - "hold"
        - "extended-sampling"
        - "ad-core-self-diagnostic"
        - "addition"
        - "mpx-normal"
        - "mpx-addition"
        - "pin-level-self-diagnostic"
        - "wiring-break-mode-1"
        - "wiring-break-mode-2-pull-down"
        - "wiring-break-mode-2-pull-up"
        - "self-diagnostic-wiring-break-mode-1"
        - "self-diagnostic-wiring-break-mode-2-pull-down"
        - "self-diagnostic-wiring-break-mode-2-pull-up"
        - "ad-conversion-path-diagnostic"
      description: |
        ADCK virtual channel conversion type.
        If omitted, the virtual channel is configured for normal A/D
        conversion. Use "hold" for T&H hold-value conversion channels such as
        T&H00, T&H01, and T&H02.

    renesas,physical-channel:
      type: int
      description: |
        SoC-specific hardware analog input selector associated with this
        Zephyr ADC channel.
        For renesas,conversion-type = "normal", this value selects the normal
        A/D conversion input selector defined by the ADCK channel mapping of
        the target SoC.
        For renesas,conversion-type = "hold", this value selects the T&H hold
        input index:
        0 = T&H00
        1 = T&H01
        2 = T&H02
        3 = T&H03
        If renesas,conversion-type is omitted, "normal" is used.

    renesas,mpx-value:
      type: int
      default: 0
      min: 0
      max: 7

    renesas,wait-table:
      type: int
      default: 0
      min: 0
      max: 8
      description: Zero disables wait; values 1 through 8 select wait tables 0 through 7.

    renesas,upper-lower-limit-table:
      type: int
      default: 0
      min: 0
      max: 8
      description: Zero disables checking; values 1 through 8 select limit tables 0 through 7.

    renesas,self-diagnostic-level:
      type: int
      default: 0
      enum: [0, 4, 8, 12, 16]
      description: AD core self-diagnostic voltage selector encoded by ADCK VCR.GCTRL.

    renesas,adval-data:
      type: int
      default: 0
      enum: [0, 1]
      description: A/D conversion path diagnostic fixed data selector (0xAAA or 0x555).
