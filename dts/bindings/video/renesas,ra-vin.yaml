description: Renesas RA VIN Driver

compatible: "renesas,ra-vin"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  interrupts:
   required: true

  interrupt-names:
   required: true

  input-format:
    type: int

  data-type:
    type: int

  virtual-channel:
    type: int

  image-stride:
    type: int

  line-start:
    type: int

  line-end:
    type: int

  pixel-start:
    type: int

  pixel-end:
    type: int

  scaling-enable:
    type: boolean

  frame-write-complete-interrupt:
    type: boolean

child-binding:
  description: |
    "port" node with a single "endpoint" child linked, via
    remote-endpoint-label, to the MIPI CSI-2 output-side endpoint
    (renesas,ra-mipi-csi.yaml port@1) that feeds this VIN instance.
  child-binding:
    include: [video-interfaces.yaml]
