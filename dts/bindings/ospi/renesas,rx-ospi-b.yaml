description: Renesas RX OSPI

compatible: "renesas,rx-ospi-b"

include: [base.yaml, pinctrl-device.yaml]

bus: ospi

properties:
  reg:
    required: true

  unit:
    type: int
    required: true
    description: OSPI unit number

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true
