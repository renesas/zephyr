description: |
  One GWCA (Gateway CPU Agent) DMA engine of an R-Car R-Switch 3.

  The two engines are independent. Each has its own registers, queues,
  descriptor rings and receive thread, and both share the switch register
  block and the merged gateway interrupt.

  Enable the engines this core drives and disable the one another core owns.
  A port selects its engine with renesas,gwca.

compatible: "renesas,rcarsoc-rswitch3-gwca"

include: [base.yaml]

properties:
  reg:
    required: true
    enum:
      - 13
      - 14
    description: |
      Forwarding-agent index of this engine, 13 for GWCA0 and 14 for GWCA1.
      Engines and ports share one agent numbering, so no two children of the
      switch end up with the same unit address. The driver takes this engine's
      register block and its engine number for FWPBFCSDC() and TPDEMIMC_GDICM()
      from it.

  renesas,tx-ring-size:
    type: int
    required: true
    description: |
      Transmit descriptors in every queue of this engine. One queue serves one
      port. The depth sets how many frames the engine holds for transmission
      before software has to wait. It can range from 8 to 2048, and every
      descriptor reserves a frame buffer in the dedicated Ethernet RAM.

  renesas,rx-ring-size:
    type: int
    required: true
    description: |
      Receive descriptors in every queue of this engine. One queue serves one
      port. The depth sets how many frames may arrive between two runs of the
      receive thread without overrunning the ring. It can range from 8 to 4096,
      and every descriptor reserves a frame buffer in the dedicated Ethernet RAM.
