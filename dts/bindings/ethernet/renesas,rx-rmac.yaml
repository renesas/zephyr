description: Renesas RX Ethernet RMAC

compatible: "renesas,rx-rmac"

include: [ethernet-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  channel:
    type: int
    required: true

  phy-handle:
    required: true

  phy-clock:
    type: phandle
    required: true
    description: |
      Specifies the reference clock node for PHY device.

  phy-clock-type:
    type: string
    required: true
    enum:
      - "xtal"
      - "internal"
    description: |
      Specifies the clock type of reference clock:
      "xtal": use xtal as clock source
      "internal": use ETHPHYCLK pin output as clock source

  txq-num:
    type: int
    default: 2
    description: Number of TX queues

  rxq-num:
    type: int
    default: 2
    description: Number of RX queues

  txq-len:
    type: int
    default: 4
    description: |
      Number of descriptors in each TX queue

  rxq-len:
    type: int
    default: 4
    description: |
      Number of descriptors in each RX queue

  txb-num:
    type: int
    default: 12
    description: |
      Number of TX buffers

  rxb-num:
    type: int
    default: 12
    description: |
      Number of RX buffers

  power-fail-gpios:
    type: phandle-array
    description: |
      Optional input that is active while a power fail is in progress. The ETHA registers
      are not accessed during a power fail: a PHY link change reported in that time is
      deferred, and the current link state is read back from the PHY when the input goes
      inactive. Example:

        power-fail-gpios = <&port0 0 GPIO_ACTIVE_LOW>;

  gwdis:
    type: phandle-array
    description: |
      Group interrupt specifier for the GWCA0 data interrupt (gwdi).
      First cell: phandle to the group interrupt controller
      Second cell: number of the gwdi in the group
