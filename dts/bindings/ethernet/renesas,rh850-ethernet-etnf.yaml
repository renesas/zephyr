description: Renesas RH850 Ethernet T1S (10BASE-T1S)

compatible: "renesas,rh850-ethernet-etnf"

include: [ethernet-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    description: |
      Clock for using the module.

  channel:
    type: int
    default: 0
    description: ETNF controller channel index.

  mdio-interface:
    type: string
    required: true
    enum:
      - "dedicated"   # ETS0_MDC + ETS0_MDIO
      - "shared"      # ETS0_RX_MDC + ETS0_ED_MDIO
    description: |
      Selects which MDIO pin pair to use for bit-bang PHY access.
      Maps to ether_t1s_mdio_interface_type_t in the FSP.

  loopback:
    type: boolean
    description: Enable internal loopback mode (for testing only).

  pma-filtered:
    type: boolean
    description: |
      Configure PMA to handle a filtered T1S energy detection.
      If absent, unfiltered mode is used (ETHER_T1S_PMA_UNFILTERED).

  zephyr,mac-address-filter:
    type: uint8-array
    description: |
      Multicast destination MAC addresses to accept, 6 bytes per entry, at
      most 32 entries. Only used when CONFIG_ETH_RENESAS_RH850_ETNF_ADDR_FILTER
      is enabled; the table is programmed once at R_ETHER_T1S_Open() and is
      not updated at runtime. Broadcast and the interface's own unicast
      address are always accepted; unicast entries are ignored by the HAL.

      Example (IPv6 all-nodes, IPv6 solicited-node for MAC ..:12:34:56,
      IPv4 all-hosts):
        zephyr,mac-address-filter = [33 33 00 00 00 01
                                      33 33 ff 12 34 56
                                      01 00 5e 00 00 01];

  txq-num:
    type: int
    default: 1
    const: 1
    description: |
      Number of TX queues. Only support 1 queue for this version.

  rxq-num:
    type: int
    default: 1
    const: 1
    description: |
      Number of RX queues. Only support 1 queue for this version.

  txb0-num:
    type: int
    default: 8
    description: |
      TX buffer count for queue 0. Range from 1 to 64.

  rxb0-num:
    type: int
    default: 8
    description: |
      RX buffer count for queue 0. Range from 1 to 64.
