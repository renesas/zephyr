description: |
  Renesas R-Car R-Switch 3 port, one node per TSNA/ETHA agent. Read
  directly by the parent rswitch3 driver via DT_FOREACH_CHILD_STATUS_OKAY(),
  which brings the agent up, and by the per-port net_if driver in the same
  source file, which instantiates a GWCA-backed net_if for each external
  agent.

  A node is one of exactly two kinds, distinguished by which properties it
  sets:

  - external: this agent's RMAC talks to an external PHY. Set phy-handle
    and phy-mode, plus xpcs if a PCS channel drives the SerDes lane. The
    link state comes from the PHY behind phy-handle. Gets ETHA/PCS
    bring-up and a GWCA-backed net_if.
  - internal: this agent's RMAC talks directly to a TSN-ES endpoint
    instead. Set renesas,tsnes (and usually renesas,forward-ports), and
    none of xpcs, phy-handle or phy-mode. Gets internal ETHA bring-up only;
    the referenced TSN-ES device owns its own net_if and DMA engine.

  The driver rejects any other combination with a build-time assertion.

compatible: "renesas,rcarsoc-rswitch3-port"

include: [ethernet-controller.yaml]

properties:
  reg:
    required: true
    description: ETHA agent index for this physical port.

  xpcs:
    type: phandle
    description: PCS channel driving the SerDes lane for this port (external agents).

  phy-mode:
    type: string
    enum:
      - "rgmii"
      - "sgmii"
      - "usxgmii"
    description: |
      MAC-to-PCS interface mode for this port's ETHA agent. Required for
      external agents; not applicable to internal (renesas,tsnes) ones.

  renesas,gwca:
    type: phandle
    description: |
      GWCA engine that transfers this port's frames to and from a net_if on
      this core. The engine must be enabled. An external port without this
      property gets no net_if: it is only brought up and forwarded, for
      example to a TSN-ES agent through renesas,forward-ports. Not applicable
      to an internal (renesas,tsnes) port.

  renesas,tsnes:
    type: phandle
    description: |
      renesas,rcarsoc-eth-tsnes instance this agent's RMAC talks to
      internally, instead of an external SerDes/PHY. Only set on internal
      agents; mutually exclusive with xpcs/phy-handle/phy-mode.

  renesas,forward-ports:
    type: int
    description: |
      Bitmask (bit N = agent N) of external agents this internal agent's
      TSN-ES traffic may be forwarded to/from. Only meaningful alongside
      renesas,tsnes.
