description: Renesas RCAR R-Switch3 (RSW3) MDIO controller

compatible: "renesas,rcar-rsw3-mdio"

include: [mdio-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  clocks:
    required: true
    description: |
      The RSW3 AES clock controller followed by a fixed-clock provider for
      the MDC divider source rate.

  clock-names:
    required: true
    description: |
      Must contain "gate" for the RSW3 AES clock controller and
      "mdc-source" for the fixed MDC divider source rate.

  channel:
    type: int
    required: true
    description: |
      The MDIO(RMAC) channel number to use for this controller. This is required to
      differentiate between multiple MDIO(RMAC) controllers in the same system.
      In this IP only RMAC0 to RMAC4 provide external MDIO functionality.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
