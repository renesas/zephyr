description: Renesas R-Car Ethernet Rswitch 3

compatible: "renesas,rcarsoc-rswitch3"

include: [base.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  interrupts:
    description: |
      GWCA data interrupt ("RX/TX process complete for CPU"). Every queue
      interrupt of both engines is combined onto this one line.
    required: true

  interrupt-names:
    description: Interrupt names for debugging
