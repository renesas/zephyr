description: |
  Renesas RH850 system clock configuration.

compatible: "renesas,rh850-cgc-sysclk"

include: [base.yaml, clock-controller.yaml, "renesas,rh850-cgc-clock-config.yaml"]

properties:
  clock-source:
    type: phandle
    required: true
    description: |
      Parent/source clock node, for example pll, sscg0, sscg1 or iosc.
      This is intentionally a phandle instead of a raw selector number so the
      DTS describes the clock tree clearly. If a future SoC register operation
      needs a raw selector value, the driver should map this phandle plus
      the destination node to the SoC-specific selector encoding.

  modulation-enable:
    type: boolean
    description: Enable SSCG modulation for SYS_SSCG/SYS_SSCG1 paths.

  modulation-value:
    type: int
    default: 30
    description: |
      Raw hardware encoding for SSCG modulation frequency selection.
      Valid values depend on the selected SSCG input clock.
      The default corresponds to the reset value of the SELMFREQ register
      field used by the current FSP BSP clock configuration.

  modulation-dithered-range:
    type: int
    default: 0
    enum:
      - 0
      - 1
      - 2
      - 3
      - 4
    description: |
      Raw SSCG dithered-range encoding:
      0 = -1%, 1 = -2%, 2 = -3%, 3 = -4%, 4 = -5%.
      The default corresponds to the reset value of the SELMPERCENT register
      field used by the current FSP BSP clock configuration.

  "#clock-cells":
    const: 0
