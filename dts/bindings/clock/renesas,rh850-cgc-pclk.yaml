description: |
  Renesas RH850 peripheral and bus clock configuration.

compatible: "renesas,rh850-cgc-pclk"

include: [base.yaml, clock-controller.yaml, "renesas,rh850-cgc-clock-config.yaml"]

properties:
  clock-source:
    type: phandle
    required: true
    description: |
      Parent/source clock node for this clock in the Zephyr clock
      tree model, for example clk_hsb, clkc_hsb, mosc, hsiosc or lsiosc.

  "#clock-cells":
    const: 0
