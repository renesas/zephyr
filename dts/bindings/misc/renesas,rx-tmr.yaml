description: Renesas RX TMR

compatible: "renesas,rx-tmr"

include: base.yaml

properties:
  reg:
    required: true

  channel:
    type: int
    required: true

  renesas,prescaler:
    description: |
      TMR clock divider for PCLKB. timer clock = (clock-source / (1 << prescaler))
    type: int
    required: true
    enum:
      - 0
      - 1
      - 3
      - 5
      - 6
      - 10
      - 13

  interrupts-extended:
    required: true

  interrupt-names:
    required: true
