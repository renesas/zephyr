description: Renesas RX GPT controller

compatible: "renesas,rx-gpt"

include: [base.yaml, pinctrl-device.yaml]

properties:
  channel:
    type: int
    description: channel GPT

  reg:
    required: true

  clocks:
    required: true

  divider:
    type: string
    required: true
    enum:
      - "DIV_1"
      - "DIV_2"
      - "DIV_4"
      - "DIV_8"
      - "DIV_16"
      - "DIV_32"
      - "DIV_64"
      - "DIV_128"
      - "DIV_256"
      - "DIV_512"
      - "DIV_1024"

  interrupts:
    required: true

  interrupt-names:
    required: true
