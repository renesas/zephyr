description: Renesas RX SCI B controller

compatible: "renesas,rx-sci-b"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  channel:
    type: int
    description: |
      The number of channels available in the SCI controller. This is used to
      differentiate multiple instances of the same controller type.

  tei-ctrl:
    type: phandle
    description: |
      Group interrupt controller for the transmit end interrupt (TEI). This only applies
      in cases the RX MCU supports group interrupt feature

  tei-number:
    type: int
    description: |
      Number of the TEI in the interrupt group of tei-ctrl

  eri-ctrl:
    type: phandle
    description: |
      Group interrupt controller for the error interrupt (ERI). This only applies
      in cases the RX MCU supports group interrupt feature

  eri-number:
    type: int
    description: |
      Number of the ERI in the interrupt group of eri-ctrl
