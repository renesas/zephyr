description: Renesas RX USB full-speed controller

compatible: "renesas,rx-usbfs"

include: [pinctrl-device.yaml, usb-ep.yaml]

properties:
  phys-clock:
    type: phandles
    required: true
    description: USBFS physical clock.

  interrupts:
    required: true
    description: |
      IRQ number and priority to use for USBFS.

  interrupt-names:
    required: true
    enum:
      - "usbi"
      - "usbr"
    description: |
      Interrupts must be given corresponding names so that the shim driver can recognize them.

  reg:
    required: true

  phys:
    type: phandle
    description: PHY provider specifier
