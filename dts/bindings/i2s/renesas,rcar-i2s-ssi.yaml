description: Renesas R-Car I2S controller

compatible: "renesas,rcar-i2s-ssi"

include: [i2s-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  dmas:
    description: TX/RX DMA channel specifiers

  dma-names:
    description: Must be "tx" and/or "rx"
