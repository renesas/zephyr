description: Renesas RA MIPI DSI host

compatible: "renesas,ra-mipi-dsi"

include: [mipi-dsi-host.yaml]

properties:
  clocks:
    required: true

  interrupts:
    required: true

  interrupt-names:
    type: string-array
    required: true
    description: name of each interrupt

  phys:
    type: phandle-array
    required: true
    description: |
      MIPI D-PHY providing the physical layer for this DSI host, in master
      mode. See renesas,ra-mipi-dphy.yaml.

  phy-names:
    type: string-array

  ulps-wakeup-period:
    type: int
    description: ULPS wakeup period.

  video-mode-delay:
    type: int
    description: |
      Set the delay value inside DSI Host until the transfer begins.

  timing:
    type: array
    description: |
      MIPI DSI timing parameter: <CLKSTPT CLKBFHT CLKKPT GOLPBKT>
