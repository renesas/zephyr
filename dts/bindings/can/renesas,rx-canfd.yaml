description: Renesas RX CANFD controller

compatible: "renesas,rx-canfd"

include: [can-fd-controller.yaml, pinctrl-device.yaml]

properties:
  clocks:
    required: true

  clock-names:
    required: true

  channel:
    type: int
    required: true

  rx-max-filters:
    type: int
    default: 64
    description: |
      To determine the maximum number of rx filters in the Acceptance Filter List can be added on this CAN device.
      The total number of filters must be less than or equal to 64 per channel.
