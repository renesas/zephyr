description: Renesas RX CANFD controller global

compatible: "renesas,rx-canfd-global"

include: [base.yaml]

properties:
  clocks:
    required: true

  clock-names:
    required: true

  dll-min-freq:
    type: int
    description: |
      Specifies the Data Link Layer clock limit on this device: DLL clock frequency > dll-min-freq.

  dll-max-freq:
    type: int
    description: |
      Specifies the Data Link Layer clock limit on this device: DLL clock frequency <= dll-max-freq.
