common:
  tags:
    - drivers
    - clock_control

tests:
  drivers.clock.clock_control_api_default:
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32c3_devkitc
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - sltb010a@0
      - xg24_dk2601b
      - xg27_dk2602a
      - xg29_rb4412a
      - bg29_rb4420a
      - sam_e54_xpro
      - pic32cm_jh01_cpro
    integration_platforms:
      - esp32_devkitc/esp32/procpu

  drivers.clock.clock_control_nrf5:
    platform_allow:
      - nrf51dk/nrf51822
      - nrf52dk/nrf52832
      - nrf52840dk/nrf52840
      - nrf9160dk/nrf9160
      - nrf5340dk/nrf5340/cpuapp
