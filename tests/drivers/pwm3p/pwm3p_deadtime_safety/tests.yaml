# This test's ztest assertions only cover the software-visible half of the check (that the
# driver accepts a large, sudden 5%->95% duty jump on all 3 phases without error). Whether the
# physical deadtime gap ever reaches 0 can only be confirmed by a human capturing the 6
# physical outputs with a logic analyzer/oscilloscope while this test runs on real hardware -
# see README.rst for the manual procedure. A green ztest result here is necessary but not
# sufficient to validate the physical outputs.
tests:
  drivers.pwm3p.deadtime_safety:
