CONFIG_ZTEST=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Enable driver and loopback config
# CONFIG_ETH_DRIVER=y
CONFIG_ETH_RENESAS_RCARSOC_TSNES_CONFIG_LOOPBACK=y
CONFIG_ETH_RENESAS_RCARSOC_RSWITCH3=n
CONFIG_TEST_RANDOM_GENERATOR=y

# # Memory settings for packets
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=1514

# Sockets setup to bypass IP stack for L2 testing
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_SOCKETS_POLL_MAX=4

CONFIG_HEAP_MEM_POOL_SIZE=524288

CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ETH_RENESAS_RCARSOC_TSNES_RX_THREAD_STACK=8192

CONFIG_ETH_RENESAS_RCARSOC_TSNES_BUFFER_POOL_SIZE=524288

CONFIG_ETH_RENESAS_RCARSOC_TSNES_ENABLE_DMA_CACHE_OPS=y
