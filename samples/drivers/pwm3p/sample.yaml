sample:
  name: PWM3P (3-phase PWM)
  description: >
    Minimal PWM3P usage example: configure period/duty, enable the 6
    complementary U/V/W outputs, and sweep the duty cycle.
common:
  tags:
    - drivers
    - pwm
    - pwm3p
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "PWM3P ready: period=(.*) counts, counter clock=(.*) Hz \\(PWM freq=(.*) Hz\\)"
      - "PWM3P output enabled, sweeping duty (.*)%..(.*)%"
  depends_on: pwm
tests:
  sample.drivers.pwm3p:
    platform_allow:
