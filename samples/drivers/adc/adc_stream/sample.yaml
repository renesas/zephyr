sample:
  name: ADC stream sample
common:
  tags: adc
  depends_on: adc
  filter: dt_alias_exists("adc0") and dt_node_has_prop("/zephyr,user","io-channels")
  harness: console
  harness_config:
    type: one_line
    regex:
      - "^ADC data for [^@]+@\\d+ channel \\d+ \\([0-9.]+\\) \\d+ns$"
tests:
  sample.drivers.adc.adc_stream: {}
  sample.drivers.adc.adc_stream.ad4052-stream:
    extra_args:
      - SHIELD=eval_ad4052_ardz
      - EXTRA_CONF_FILE=ad4052-stream.conf
      - DTC_OVERLAY_FILE=boards/apard32690_max32690_m4_ad4052.overlay
    platform_allow:
      - apard32690/max32690/m4
  sample.drivers.adc.adc_stream.max32-stream:
    extra_args:
      - EXTRA_CONF_FILE=max32-stream.conf
      - DTC_OVERLAY_FILE=boards/apard32690_max32690_m4_max32.overlay
    platform_allow:
      - apard32690/max32690/m4
  sample.drivers.adc.adc_stream.rh850-adck-stream:
    extra_args:
      - EXTRA_CONF_FILE=rh850-adck-stream.conf
      - DTC_OVERLAY_FILE=boards/pb_rh850u2b_468pin_r7f70254xfabg-c.overlay
    platform_allow:
      - pb_rh850u2b_468pin/r7f70254xfabg-c
  sample.drivers.adc.adc_stream.rh850-adcj-stream:
    extra_args:
      - EXTRA_CONF_FILE=rh850-adcj-stream.conf
      - DTC_OVERLAY_FILE=boards/pb_rh850u2a_516pin_r7f702300aebbc-c.overlay
    platform_allow:
      - pb_rh850u2a_516pin/r7f702300aebbc-c
