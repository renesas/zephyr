CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
CONFIG_NET_DHCPV4=y

# The IPv4 and IPv6 UDP/TCP servers of zperf take 4 contexts: leave room for
# the TCP connections under test.
CONFIG_NET_MAX_CONTEXTS=8

CONFIG_NET_PKT_RX_COUNT=512
CONFIG_NET_PKT_TX_COUNT=512
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_NET_BUF_TX_COUNT=512
CONFIG_NET_BUF_DATA_SIZE=1536

CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192

# No traffic class threads: RX is processed on the GWCA RX thread and TX is
# pushed to the driver from the sending thread.
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NET_TC_TX_COUNT=0

# Without TX traffic class threads, the whole send path runs on the zperf
# work queue.
CONFIG_ZPERF_WORK_Q_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y

# TCP window scaling (RFC 7323) for windows above 64 KB. Send window:
# rate x ACK delay of the test host (~1.5 Gbit/s x ~2 ms). Receive window:
# 2.4 Gbit/s x ~0.3 ms round trip.
CONFIG_NET_TCP_WINDOW_SCALE=y
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=131072
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=393216

# Largest UDP payload without IP fragmentation.
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1472

# GWCA RX interrupt coalescing: with the default 712.5 MHz GWCA clock this
# gives a 1 us base period and a 20 us delay.
CONFIG_ETH_RENESAS_RSWITCH3_GWCA_IRQ_DELAY_PRESCALER=712
CONFIG_ETH_RENESAS_RSWITCH3_GWCA_RX_IRQ_DELAY=20

# Network per-packet path and memcpy in the R52 ITCM
CONFIG_RCAR_GEN5_R52_ITCM_NET_HOT_PATH=y
CONFIG_RCAR_GEN5_R52_FAST_MEMCPY=y
