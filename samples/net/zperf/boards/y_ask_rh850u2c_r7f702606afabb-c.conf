CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_STATISTICS=n
CONFIG_NET_IPV6=n
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=8760
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048

CONFIG_SHELL_STACK_SIZE=3072

CONFIG_NET_TC_RX_COUNT=0
CONFIG_ETH_RENESAS_RH850_ETNF_RX_THREAD_STACK_SIZE=2048
CONFIG_ETH_RENESAS_RH850_ETND_RX_THREAD_STACK_SIZE=2048

CONFIG_NET_TC_TX_COUNT=0
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=30000

# The POSIX API does not build with the IAR RH850 C library
CONFIG_POSIX_API=n
