CONFIG_FLASH=y

# The OSPI image is verified from MRAM with PSA Crypto (ML-DSA-87, FIPS 204,
# pure mode, mldsa-native) before any code in the OSPI flash is executed.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHAKE256=y
CONFIG_TF_PSA_CRYPTO_PQCP_MLDSA_ENABLED=y
CONFIG_TF_PSA_CRYPTO_PQCP_MLDSA_87_ENABLED=y
CONFIG_TF_PSA_CRYPTO_PQCP_REDUCE_RAM=y
# ML-DSA-87 verification with mldsa-native (REDUCE_RAM) needs about 41 KB of
# stack (MLD_TOTAL_ALLOC_87_VERIFY = 41216, see mldsa_native.h). Use the same
# 64 KB as MCUboot's ML-DSA build for headroom.
CONFIG_MAIN_STACK_SIZE=65536

# Required by the OSPI_B driver when CODE_DATA_RELOCATION is on (MPU exec on RAM text)
CONFIG_CODE_DATA_RELOCATION_SRAM=y

CONFIG_BOOTLOADER_MCUBOOT=y
