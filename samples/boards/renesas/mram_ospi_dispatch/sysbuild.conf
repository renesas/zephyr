# MCUboot -> MRAM dispatcher (this app) -> OSPI code
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ML_DSA=y

# MCUboot's own ML-DSA-87 key. By default this is the public MCUboot test key: replace it with a
# production key. It is unrelated to the OSPI signing key (-DOSPI_SIGN_KEY).
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/path/to/mcuboot_mldsa87.pem"
