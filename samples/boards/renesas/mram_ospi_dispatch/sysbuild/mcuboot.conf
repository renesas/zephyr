# ML-DSA-87 verification with mldsa-native (REDUCE_RAM) needs about 41 KB of
# stack (MLD_TOTAL_ALLOC_87_VERIFY = 41216, see mldsa_native.h). MCUboot's
# prj.conf sets 10 KB, which overflows silently and hangs after
# "Starting bootloader".
CONFIG_MAIN_STACK_SIZE=65536
