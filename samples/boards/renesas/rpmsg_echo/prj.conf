CONFIG_KERNEL_BIN_NAME="rpmsg_echo"
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MBOX=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Configurations related to OpenAMP
CONFIG_OPENAMP=y
# Use Zephyr's supported OpenAMP resource table
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_COPY_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=256
CONFIG_OPENAMP_VRING_ALIGNMENT=4096
CONFIG_OPENAMP_RSC_TABLE_VDEV_NOTIFY_ID=31
CONFIG_OPENAMP_RSC_TABLE_IPM_RX_ID=1
CONFIG_OPENAMP_RSC_TABLE_IPM_TX_ID=2
